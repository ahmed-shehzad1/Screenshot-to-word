name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build standalone application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name ScreenshotToWord --paths src `
            --icon src/screenshot_to_word/assets/app_icon.ico `
            --add-data "src/screenshot_to_word/assets;screenshot_to_word/assets" `
            --collect-all PySide6 src/screenshot_to_word/__main__.py

      - name: Build Windows installer
        run: iscc installer/ScreenshotToWord.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenshotToWord-Windows-Installer
          path: release/ScreenshotToWord-Setup-0.2.1.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ScreenshotToWord-Setup-0.2.1.exe
          generate_release_notes: true
